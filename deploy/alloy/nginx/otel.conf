# Nginx virtual host for Nembus OTLP Ingestion -> Grafana Alloy on EC2
# Install on EC2 at /etc/nginx/sites-available/otel.conf and symlink to sites-enabled.
# Then run: sudo certbot --nginx -d otel.nashrms.com
#
# IMPORTANT: Set your shared ingestion token in /etc/nginx/snippets/nembus-otel-token.conf:
#   set $nembus_otel_expected "YOUR_STRONG_SECRET_TOKEN";

server {
    listen 80;
    server_name otel.nashrms.com;

    client_max_body_size 16m;

    # Define $nembus_otel_expected in /etc/nginx/snippets/nembus-otel-token.conf
    include /etc/nginx/snippets/nembus-otel-token.conf;

    location /v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Otel-Token, traceparent, tracestate" always;
            return 204;
        }

        set $auth_ok 0;
        if ($http_x_otel_token = $nembus_otel_expected) {
            set $auth_ok 1;
        }
        if ($http_authorization = "Bearer $nembus_otel_expected") {
            set $auth_ok 1;
        }
        if ($nembus_otel_expected = "") {
            set $auth_ok 0;
        }
        if ($auth_ok = 0) {
            return 401 '{"error":"unauthorized telemetry ingest token"}';
        }

        proxy_pass http://127.0.0.1:4318;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
