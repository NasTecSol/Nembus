syntax = "proto3";

package sync;

option go_package = "NEMBUS/internal/sync/proto";

import "google/protobuf/timestamp.proto";

service SyncService {
  // Pull data from Cloud to Desktop
  rpc PullData(SyncRequest) returns (stream SyncDelta);
  
  // Push changes from Desktop to Cloud
  rpc PushData(stream SyncDelta) returns (SyncResponse);
}

message SyncRequest {
  string tenant_slug = 1;
  google.protobuf.Timestamp last_sync_time = 2;
  repeated string table_names = 3;
}

message SyncDelta {
  string table_name = 1;
  string action = 2; // INSERT, UPDATE, DELETE
  bytes data_json = 3; // Serialized record
  google.protobuf.Timestamp event_time = 4;
}

message SyncResponse {
  bool success = 1;
  string message = 2;
  int32 records_processed = 3;
}
