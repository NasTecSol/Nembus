        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get backup status for a tenant
      tags:
      - backup
  /api/backup/trigger:
    post:
      consumes:
      - application/json
      description: Starts an asynchronous backup job on the server. The backup is
        saved to disk on the server and is NOT streamed to the caller. Use GET /api/backup/jobs/:job_id
        to track progress.
      parameters:
      - description: Tenant identifier
        in: header
        name: x-tenant-id
        required: true
        type: string
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Backup request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.TriggerBackupRequest'
      produces:
      - application/json
      responses:
        "201":
