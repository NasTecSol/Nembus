paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and receive JWT token
      parameters:
      - description: Tenant identifier
        in: header
        name: x-tenant-id
        required: true
        type: string
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: User login
      tags:
      - auth
  /api/backup/grpc-info/{tenant}:
    get:
      description: Returns the gRPC server address and tenant slug so a POS terminal
        or offline app can initiate a direct streaming backup
      parameters:
      - description: Tenant identifier
        in: header
        name: x-tenant-id
        required: true
        type: string
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BackupGRPCInfoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get gRPC connection info for backup streaming
      tags:
      - backup
  /api/backup/jobs:
    get:
      description: Returns all server-side backup jobs (running, done, failed) for
        this server instance
      parameters:
      - description: Tenant identifier
        in: header
        name: x-tenant-id
        required: true
        type: string
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.BackupJobResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all backup jobs
      tags:
      - backup
  /api/backup/jobs/{job_id}:
    get:
      description: Returns the current status (running/done/failed), file path, and
        start time of a triggered backup job
      parameters:
      - description: Tenant identifier
        in: header
        name: x-tenant-id
        required: true
        type: string
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Job ID returned by /api/backup/trigger
        in: path
        name: job_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BackupJobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get status of a server-side backup job
      tags:
      - backup
  /api/backup/status/{tenant}:
    get:
      description: Returns whether a gRPC backup stream is currently active for the
        tenant, and how many bytes have been sent so far
      parameters:
      - description: Tenant identifier
        in: header
        name: x-tenant-id
        required: true
        type: string
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      produces:
