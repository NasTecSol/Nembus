<div class="min-h-screen bg-[#0f172a] text-slate-200 flex flex-col items-center justify-center p-4">
    <div
        class="max-w-md w-full space-y-8 bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 p-10 rounded-3xl shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-blue-600/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 left-0 -mb-10 -ml-10 w-40 h-40 bg-emerald-600/10 rounded-full blur-3xl"></div>

        <div class="text-center relative">
            <div
                class="mx-auto w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-600/20 mb-6">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h2 class="text-3xl font-bold text-white tracking-tight">Welcome back</h2>
            <p class="mt-2 text-slate-400">Please enter your details to sign in</p>
        </div>

        <form class="mt-8 space-y-6" (submit)="login()">
            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-400 mb-1.5 ml-1">Username</label>
                    <input id="username" name="username" type="text" [(ngModel)]="username" required
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all"
                        placeholder="admin">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-400 mb-1.5 ml-1">Password</label>
                    <input id="password" name="password" type="password" [(ngModel)]="password" required
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox"
                        class="h-4 w-4 rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-blue-500/50">
                    <label for="remember-me" class="ml-2 block text-sm text-slate-400">Remember me</label>
                </div>
                <div class="text-sm">
                    <a href="#" class="font-medium text-blue-400 hover:text-blue-300 transition-colors">Forgot
                        password?</a>
                </div>
            </div>

            <button type="submit"
                class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-blue-600 hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 shadow-lg shadow-blue-600/20 transition-all active:scale-[0.98]">
                Sign in
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-slate-500 text-xs">NEMBUS Desktop Edition v1.0.0</p>
        </div>
    </div>
</div>
