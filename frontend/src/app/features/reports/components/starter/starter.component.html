<div class="dashboard-card mb-10 overflow-auto p-6">
  <!-- Tab Buttons -->
  <div class="tabs-container" role="tablist">
    <button
      *ngFor="let tab of tabs"
      (click)="setActiveTab(tab)"
      class="btn-tab"
      [ngClass]="
        activeTab === tab ? 'btn-tab-active rounded-lg' : 'btn-tab-not-active'
      "
    >
      {{ tab }}
    </button>
  </div>

  <div>
    <!-- Row 1 -->
    <div class="form-group grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5">
      <div class="custom-checkbox-wrapper form-group">
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">Annual Report</span>
      </div>

      <div class="custom-checkbox-wrapper form-group">
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">Invoices</span>
      </div>

      <div
        *ngIf="activeTab === 'Customers' || activeTab === 'Items'"
        class="custom-checkbox-wrapper form-group"
      >
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">Individual Display</span>
      </div>

      <div
        *ngIf="activeTab === 'Customers' || activeTab === 'Items'"
        class="custom-checkbox-wrapper form-group"
      >
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">Total By Customer</span>
      </div>

      <div
        *ngIf="activeTab === 'Customers' || activeTab === 'Items'"
        class="custom-checkbox-wrapper form-group"
      >
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">Delivery Notes</span>
      </div>
    </div>

    <!-- Row 2 -->
    <div class="form-group grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5">
      <div class="custom-checkbox-wrapper form-group">
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">Monthly Report</span>
      </div>

      <div class="custom-checkbox-wrapper form-group">
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">Orders</span>
      </div>

      <div
        *ngIf="activeTab === 'Customers' || activeTab === 'Items'"
        class="custom-checkbox-wrapper form-group"
      >
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">Group Display</span>
      </div>

      <div
        *ngIf="activeTab === 'Customers' || activeTab === 'Items'"
        class="custom-checkbox-wrapper form-group"
      >
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">Total By Blanket Agreement</span>
      </div>
    </div>

    <!-- Row 3 -->
    <div class="mt-3 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5">
      <div class="custom-checkbox-wrapper form-group">
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">Quarterly Report</span>
      </div>
      <div
        *ngIf="activeTab === 'Items'"
        class="custom-checkbox-wrapper form-group"
      >
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">No Totals</span>
      </div>
      <div
        *ngIf="activeTab === 'Sales Employees'"
        class="custom-checkbox-wrapper form-group"
      >
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">Delivery Notes</span>
      </div>
    </div>
  </div>
  <div class="divider my-7"></div>
  <div class="grid grid-cols-1 gap-3 lg:grid-cols-3">
    <div class="custom-checkbox-wrapper">
      <label>
        <input type="checkbox" checked class="peer checkbox-teal" />
        <span class="checkbox-svg">
          <check-icon />
        </span>
      </label>
      <span class="checkbox-label-text">Posting Date</span>
    </div>
    <div class="reports-label-wrapper">
      <label>From</label>
      <input class="input general-input" type="date" />
    </div>
    <div class="reports-label-wrapper">
      <label>To</label>
      <input class="input general-input" type="date" />
    </div>
  </div>
  <div class="form-group grid grid-cols-1 gap-3 lg:grid-cols-3">
    <div class="custom-checkbox-wrapper">
      <label>
        <input type="checkbox" checked class="peer checkbox-teal" />
        <span class="checkbox-svg">
          <check-icon />
        </span>
      </label>
      <span class="checkbox-label-text">Due Date</span>
    </div>
    <div class="reports-label-wrapper">
      <label>From</label>
      <input class="input general-input" type="date" />
    </div>
    <div class="reports-label-wrapper">
      <label>To</label>
      <input class="input general-input" type="date" />
    </div>
  </div>
  <div class="form-group grid grid-cols-1 gap-3 lg:grid-cols-3">
    <div class="custom-checkbox-wrapper">
      <label>
        <input type="checkbox" checked class="peer checkbox-teal" />
        <span class="checkbox-svg">
          <check-icon />
        </span>
      </label>
      <span class="checkbox-label-text">Document Date</span>
    </div>
    <div class="reports-label-wrapper">
      <label>From</label>
      <input class="input general-input" type="date" />
    </div>
    <div class="reports-label-wrapper">
      <label>To</label>
      <input class="input general-input" type="date" />
    </div>
  </div>
  <div class="divider my-7"></div>
  <div>
    <p class="font-bold text-black">Main Selection</p>
    <div class="mt-5 grid grid-cols-1 gap-3 lg:grid-cols-3">
      <div class="custom-checkbox-wrapper">
        <span class="checkbox-label-text">Customer</span>
      </div>
      <div class="reports-label-wrapper">
        <label>Code From</label>
        <input class="input general-input" type="text" />
      </div>
      <div class="reports-label-wrapper">
        <label>To</label>
        <input class="input general-input" type="text" />
      </div>
    </div>
    <div class="mt-10 grid grid-cols-1 gap-3 lg:grid-cols-3">
      <div class="custom-checkbox-wrapper">
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">
          Display Amounts In System Currency
        </span>
      </div>
      <div
        *ngIf="activeTab === 'Items' || activeTab === 'Sales Employees'"
        class="custom-checkbox-wrapper"
      >
        <label>
          <input type="checkbox" checked class="peer checkbox-teal" />
          <span class="checkbox-svg">
            <check-icon />
          </span>
        </label>
        <span class="checkbox-label-text">Secondary Selection</span>
      </div>
    </div>
  </div>
  <div class="mt-10 flex flex-wrap justify-end gap-3 md:mr-5">
    <button *ngIf="activeIndex !== 0" (click)="previous()" class="btn-submit">
      Previous
    </button>
    <button *ngIf="activeIndex !== 2" (click)="next()" class="btn-submit">
      Next
    </button>
    <button *ngIf="activeIndex == 2" (click)="finish()" class="btn-submit">
      Finished
    </button>
  </div>
</div>
