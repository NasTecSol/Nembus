<div class="fixed top-0 right-0 bottom-0 left-0 z-50 flex items-center justify-center bg-black/10">
  <div
    class="bg-white-snow relative w-full max-w-[600px] rounded-3xl px-16 py-10"
  >
    <div class="flex flex-col gap-8">
      <h3 class="text-2xl font-semibold" translate>
        USER_ROLES.CHANGE_EMPLOYEE_SHIFT
      </h3>

      <div class="mt-3">
        <label class="modal-label" translate>USER_ROLES.FROM_TIME</label>
        <div class="flex items-center gap-4">
          <input
            class="modal-input"
            type="time"
            placeholder="{{ 'USER_ROLES.SELECT' | translate }}"
          />
          <span class="text-gray-border text-base" translate>
            USER_ROLES.TO
          </span>
          <input
            class="modal-input"
            type="time"
            placeholder="{{ 'USER_ROLES.SELECT' | translate }}"
          />
        </div>
      </div>

      <div class="mt-3">
        <label class="modal-label" translate>USER_ROLES.FROM_DATE</label>
        <div class="flex items-center gap-4">
          <input
            class="modal-input"
            type="date"
            placeholder="{{ 'USER_ROLES.SELECT' | translate }}"
          />
          <span class="text-gray-border text-base" translate>
            USER_ROLES.TO
          </span>
          <input
            class="modal-input"
            type="date"
            placeholder="{{ 'USER_ROLES.SELECT' | translate }}"
          />
        </div>
      </div>

      <div class="flex justify-center gap-4">
        <button (click)="confirm()" class="btn-modal" translate>
          USER_ROLES.CHANGE
        </button>
        <button
          (click)="cancel()"
          class="btn-modal text-primary bg-white"
          translate
        >
          USER_ROLES.CANCEL
        </button>
      </div>
    </div>
  </div>
</div>
