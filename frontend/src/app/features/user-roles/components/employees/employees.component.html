<div class="mt-4 grid grid-cols-1">
  <div class="flex justify-end">
    <button (click)="openModal()" class="btn-add min-h-11">
      <i class="fa fa-plus-circle plus-icon"></i>
      {{ "USER_ROLES.CREATE_EMPLOYEE" | translate }}
    </button>
  </div>

  <div class="min-h-screen overflow-x-auto">
    <table class="data-table shift-table">
      <thead>
        <tr>
          <th>{{ "USER_ROLES.ID_NUMBER" | translate }}</th>
          <th>{{ "USER_ROLES.NAME" | translate }}</th>
          <th>{{ "USER_ROLES.ROLE" | translate }}</th>
          <th>{{ "USER_ROLES.CASH_COUNTERS" | translate }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of tableData" class="text-primary">
          <td>{{ item.id }}</td>
          <td>{{ item.name }}</td>
          <td>{{ item.role }}</td>
          <td>{{ item.counterId }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Create Employee Modal -->
<app-create-employee-modal
  *ngIf="showModal"
  [buttonText]="'USER_ROLES.CREATE_EMPLOYEE'"
  (close)="confirmCreateEmployee($event)"
></app-create-employee-modal>
