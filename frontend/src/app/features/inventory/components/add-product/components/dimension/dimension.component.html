<form class="fex-grow">
  <div class="form-row">
    <div class="form-group">
      <label translate>INVENTORY.ITEM_LENGTH</label>
      <span class="text-gray ml-1" translate>INVENTORY.OPTIONAL</span>
      <input
        class="input border-white-light"
        type="text"
        [placeholder]="'INVENTORY.ENTER_UNITS' | translate"
      />
    </div>
    <div class="form-group">
      <label translate>INVENTORY.ITEM_HEIGHT</label>
      <span class="text-gray ml-1" translate>INVENTORY.OPTIONAL</span>
      <input
        class="input border-white-light"
        type="text"
        [placeholder]="'INVENTORY.ENTER_UNITS' | translate"
      />
    </div>
    <div class="form-group">
      <label translate>INVENTORY.ITEM_WIDTH</label>
      <span class="text-gray ml-1" translate>INVENTORY.OPTIONAL</span>
      <input
        class="input border-white-light"
        type="text"
        [placeholder]="'INVENTORY.ENTER_UNITS' | translate"
      />
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label translate>INVENTORY.ITEM_WEIGHT</label>
      <span class="text-gray ml-1" translate>INVENTORY.OPTIONAL</span>
      <input
        class="input border-white-light"
        type="text"
        [placeholder]="'INVENTORY.ENTER_UNITS' | translate"
      />
    </div>
    <div class="form-group">
      <label translate>INVENTORY.ITEM_VOLUME</label>
      <span class="text-gray ml-1" translate>INVENTORY.OPTIONAL</span>
      <input
        class="input border-white-light"
        type="text"
        [placeholder]="'INVENTORY.ENTER_UNITS' | translate"
      />
    </div>
    <div class="form-group">
      <label translate>INVENTORY.VOLUME_UNITS</label>
      <span class="text-gray ml-1" translate>INVENTORY.OPTIONAL</span>
      <input
        class="input border-white-light"
        type="text"
        [placeholder]="'INVENTORY.ENTER_UNITS' | translate"
      />
    </div>
  </div>

  <!-- Submit button: pinned at bottom center on md+ -->
  <div class="absolute right-0 bottom-10 left-0 hidden justify-center md:flex">
    <button class="btn-primary h-12 md:w-30" type="submit" translate>
      INVENTORY.SUBMIT
    </button>
  </div>

  <!-- Submit button for small screens (normal flow) -->
  <div class="mt-5 flex justify-center md:hidden">
    <button class="btn-primary h-12 md:w-30" type="submit" translate>
      INVENTORY.SUBMIT
    </button>
  </div>
</form>
