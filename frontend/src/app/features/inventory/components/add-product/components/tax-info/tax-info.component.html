<form class="flex-grow">
  <div class="form-row">
    <div class="form-group">
      <label translate>INVENTORY.TAX_CODE_AR</label>
      <span class="text-gray ml-1" translate>INVENTORY.READY_TO_ORDER</span>
      <input
        class="input border-white-light"
        type="text"
        [placeholder]="'INVENTORY.ENTER' | translate"
        required
      />
    </div>
    <div class="form-group">
      <label translate>INVENTORY.TAX_CODE_AP</label>
      <span class="text-gray ml-1" translate>INVENTORY.OPTIONAL</span>
      <input
        class="input border-white-light"
        type="text"
        [placeholder]="'INVENTORY.ENTER' | translate"
        required
      />
    </div>
    <div class="form-group">
      <label translate>INVENTORY.INDIRECT_TAX</label>
      <input
        class="input border-white-light"
        type="text"
        [placeholder]="'INVENTORY.ENTER' | translate"
        required
      />
    </div>
  </div>

  <!-- Submit button: pinned at bottom center on md+ -->
  <div class="absolute right-0 bottom-10 left-0 hidden justify-center md:flex">
    <button type="submit" class="btn-primary h-12 md:w-30" translate>
      INVENTORY.SUBMIT
    </button>
  </div>

  <!-- Submit button for small screens (normal flow) -->
  <div class="mt-5 flex justify-center md:hidden">
    <button type="submit" class="btn-primary h-12 md:w-30" translate>
      INVENTORY.SUBMIT
    </button>
  </div>
</form>
