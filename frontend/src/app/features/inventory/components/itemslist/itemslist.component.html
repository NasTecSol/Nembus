<div class="grid grid-cols-1 gap-3 py-2 md:grid-cols-5">
  <div
    class="dashboard-card col-span-2 flex-grow overflow-x-auto rounded-2xl border-0 bg-[#F2F4F7] p-4 shadow-none"
  >
    <table class="data-table">
      <thead>
        <tr class="text-dark-bold-lg">
          <th translate>INVENTORY.ITEM_NUMBER</th>
          <th translate>INVENTORY.NAME</th>
          <th translate>INVENTORY.CATEGORY</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let item of items"
          (click)="selectStore(item)"
          class="text-[#666666]"
          [ngClass]="{ 'text-white': selectedStore === item }"
          [class.selected-row]="selectedStore === item"
          [class.hoverable-row]="selectedStore !== item"
        >
          <td
            class="font-bold text-black"
            [ngClass]="{ 'rounded-l-lg text-white': selectedStore === item }"
          >
            {{ item.itemNumber }}
          </td>
          <td>{{ item.name }}</td>
          <td [ngClass]="{ 'rounded-r-lg': selectedStore === item }">
            {{ item.category }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="dashboard-card custom-shadow col-span-3 rounded-2xl p-4">
    <div role="tablist" class="tabs-container flex-wrap">
      <button
        *ngFor="let tab of tabs"
        (click)="setActiveTab(tab)"
        class="btn-tab"
        [ngClass]="{
          'btn-tab-active': activeTab === tab,
          'btn-tab-not-active': activeTab !== tab,
        }"
      >
        {{ "INVENTORY." + tabTranslationMap[tab] | translate }}
      </button>
    </div>

    <div class="flex h-full flex-col">
      <hr class="mt-3" />

      <!-- Item Details Tab -->
      <div *ngIf="activeTab === 'Item Details'">
        <form class="mb-2 flex-grow">
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.ITEM_NAME</label>
              <input
                class="input general-input"
                type="number"
                value="101"
                required
              />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.ITEM_TYPE</label>
              <select class="input general-input">
                <option value="Inventory" selected>
                  {{ "INVENTORY.ITEM_TYPE" | translate }}
                </option>
              </select>
            </div>
          </div>

          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.CODE_BAR</label>
              <input
                class="input general-input"
                type="text"
                value="*************"
              />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.DESCRIPTION</label>
              <input
                class="input general-input"
                type="text"
                value="Knorr Noddles 4 pack"
              />
            </div>
          </div>

          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.ITEM_CODE</label>
              <input class="input general-input" type="text" value="02365489" />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.CATEGORY_GROUP</label>
              <select class="input general-input">
                <option value="arizona" selected>
                  {{ "INVENTORY.CHOOSE" | translate }}
                </option>
              </select>
            </div>
          </div>
        </form>
      </div>

      <!-- Dimensions Tab -->
      <div *ngIf="activeTab === 'Dimensions'">
        <form class="mb-2 flex-grow">
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.ITEM_LENGTH</label>
              <input
                class="input general-input"
                type="text"
                value="120cm"
                required
              />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.ITEM_HEIGHT</label>
              <input
                class="input general-input"
                type="text"
                value="120cm"
                required
              />
            </div>
          </div>
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.ITEM_WEIGHT</label>
              <input
                class="input general-input"
                type="text"
                value="10kg"
                required
              />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.ITEM_VOLUME</label>
              <input
                class="input general-input"
                type="text"
                value="50"
                required
              />
            </div>
          </div>
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.ITEM_WIDTH</label>
              <input
                class="input general-input"
                type="text"
                value="10cm"
                required
              />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.VOLUME_UNITS</label>
              <input
                class="input general-input"
                type="text"
                value="50 Units"
                required
              />
            </div>
          </div>
        </form>
      </div>

      <!-- Inventory Details Tab -->
      <div *ngIf="activeTab === 'Inventory Details'">
        <form class="mb-2 flex-grow">
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.IS_COMMITTED</label>
              <input
                class="input general-input"
                type="number"
                value="101"
                required
              />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.ON_HAND</label>
              <input
                class="input general-input"
                type="number"
                value="101"
                required
              />
            </div>
          </div>
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.VAT_GROUP</label>
              <select class="input general-input">
                <option value="Inventory" selected>
                  {{ "INVENTORY.ITEM_TYPE" | translate }}
                </option>
              </select>
            </div>
            <div class="form-group flex gap-3">
              <div>
                <label translate>INVENTORY.MIN_ORDER_QTY</label>
                <input
                  class="input general-input"
                  type="text"
                  value="Knorr Noddles 4 pack"
                />
              </div>
              <div>
                <label translate>INVENTORY.MAX_ORDER_QTY</label>
                <input
                  class="input general-input"
                  type="text"
                  value="Knorr Noddles 4 pack"
                />
              </div>
            </div>
          </div>
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.NUMBER_IN_BUY</label>
              <input class="input general-input" type="text" value="02365489" />
            </div>
            <div class="custom-checkbox-wrapper form-group md:mt-11">
              <label>
                <input type="checkbox" checked class="peer checkbox-teal" />
                <span class="checkbox-svg">
                  <check-icon />
                </span>
              </label>
              <span class="checkbox-label-text" translate>
                INVENTORY.IS_INVENTORY_ITEM
              </span>
            </div>
          </div>
        </form>
      </div>

      <!-- Tax Info Tab -->
      <div *ngIf="activeTab === 'Tax Info'">
        <form class="mb-2 flex-grow">
          <div class="grid grid-cols-1 gap-3 md:grid-cols-3">
            <div class="form-group">
              <label translate>INVENTORY.TAX_CODE_AR</label>
              <input
                class="input general-input"
                type="text"
                value="Knorr Noddles 4 pack"
              />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.TAX_CODE_AP</label>
              <input
                class="input general-input"
                type="text"
                value="Knorr Noddles 4 pack"
              />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.INDIRECT_TAX</label>
              <input
                class="input general-input"
                type="text"
                value="Knorr Noddles 4 pack"
              />
            </div>
          </div>
        </form>
      </div>

      <!-- WholeSale & UoM Tab -->
      <div *ngIf="activeTab === 'WholeSale & UoM'">
        <form class="mb-2 flex-grow">
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.CURRENT_COUNT_DATE</label>
              <input class="input general-input" type="date" required />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.WHOLESALE_NUMBER</label>
              <input
                class="input general-input"
                type="text"
                value="40"
                required
              />
            </div>
          </div>
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.BULK_VOLUME</label>
              <input
                class="input general-input"
                type="text"
                value="*************"
              />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.BULK_VOLUME_UNITS</label>
              <input
                class="input general-input"
                type="text"
                value="Knorr Noddles 4 pack"
              />
            </div>
          </div>
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.WHOLESALE_UNITS_MEASURE</label>
              <input class="input general-input" type="text" value="02365489" />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.INVENTORY_UOM</label>
              <input class="input general-input" type="text" value="02365489" />
            </div>
          </div>
        </form>
      </div>

      <!-- Pricing Tab -->
      <div *ngIf="activeTab === 'Pricing'">
        <form class="mb-2 flex-grow">
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.LAST_PURCHASE_DATE</label>
              <input class="input general-input" type="date" required />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.LAST_PURCHASE_PRICE</label>
              <input
                class="input general-input"
                type="number"
                value="101"
                required
              />
            </div>
          </div>
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.LAST_PURCHASE_CURRENCY</label>
              <input class="input general-input" type="date" required />
            </div>
            <div class="form-group">
              <label translate>INVENTORY.LATEST_SALE_PRICE</label>
              <input
                class="input general-input"
                type="number"
                value="101"
                required
              />
            </div>
          </div>
          <div class="general-row">
            <div class="form-group">
              <label translate>INVENTORY.LAST_PURCHASE_CURRENCY</label>
              <select class="input general-input">
                <option value="Inventory" selected>SAR</option>
              </select>
            </div>
            <div class="flex justify-between">
              <div class="custom-checkbox-wrapper form-group md:mt-11">
                <label>
                  <input type="checkbox" checked class="peer checkbox-teal" />
                  <span class="checkbox-svg">
                    <check-icon />
                  </span>
                </label>
                <span class="checkbox-label-text" translate>
                  INVENTORY.IS_SALE_ITEM
                </span>
              </div>
              <div class="custom-checkbox-wrapper form-group md:mt-11">
                <label>
                  <input type="checkbox" checked class="peer checkbox-teal" />
                  <span class="checkbox-svg">
                    <check-icon />
                  </span>
                </label>
                <span class="checkbox-label-text" translate>
                  INVENTORY.IS_PURCHASE_ITEM
                </span>
              </div>
            </div>
          </div>
          <div class="form-group grid grid-cols-1 md:grid-cols-4 md:gap-3">
            <div>
              <label translate>INVENTORY.SALE_PRICE_TYPE</label>
              <select class="input general-input">
                <option value="Inventory" selected>
                  {{ "INVENTORY.CHOOSE" | translate }}
                </option>
              </select>
            </div>
            <div>
              <label translate>INVENTORY.PRICING_UNIT</label>
              <input
                class="input general-input"
                type="text"
                placeholder="Enter"
                required
              />
            </div>
            <div>
              <label translate>INVENTORY.SALE_PRICE_TYPE</label>
              <select class="input general-input">
                <option value="Inventory" selected>
                  {{ "INVENTORY.CHOOSE" | translate }}
                </option>
              </select>
            </div>
            <div>
              <label translate>INVENTORY.SALE_PRICE_TYPE</label>
              <select class="input general-input">
                <option value="Inventory" selected>
                  {{ "INVENTORY.CHOOSE" | translate }}
                </option>
              </select>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
