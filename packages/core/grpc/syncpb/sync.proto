syntax = "proto3";

package sync;

option go_package = "github.com/NasTecSol/nembus-core/grpc/syncpb";

import "google/protobuf/timestamp.proto";

// SyncService handles high-throughput streaming sync between POS terminals and Cloud.
service SyncService {
  // Client-to-Cloud push stream for local outbox items
  rpc StreamPush (stream SyncEvent) returns (stream SyncAck);

  // Cloud-to-Client pull stream for incremental delta updates (legacy)
  rpc StreamPull (PullRequest) returns (stream SyncEvent);

  // Cloud-to-Client pull stream for gap-safe monotonic change_log events (Phase 3)
  rpc StreamChanges (StreamChangesRequest) returns (stream ChangeEvent);

  // Persistent bidirectional session stream for windowed push + server change notifications (Phase 4)
  rpc StreamSession (stream SessionClientMsg) returns (stream SessionServerMsg);
}

// SyncEvent represents a single sync item or binary chunk passed in gRPC stream
message SyncEvent {
  int64 id = 1;                             // Outbox item ID / Sequence ID
  string entity_type = 2;                   // Domain entity type (e.g. pos_transactions, product_barcodes)
  int64 entity_id = 3;                      // Entity primary key ID
  string action = 4;                        // Action type: INSERT, UPDATE, DELETE
  bytes payload_json = 5;                   // Serialized JSON/binary payload
  int32 store_id = 6;                       // Store ID
  string tenant_slug = 7;                   // Tenant identifier
  google.protobuf.Timestamp event_time = 8; // Event creation timestamp
  string sha256 = 9;                        // SHA-256 hex checksum of payload_json
  uint64 chunk_offset = 10;                 // Byte offset for chunked messages (0 if unchunked)
  bool is_last_chunk = 11;                  // True if last chunk or single-chunk message
  string correlation_id = 12;               // Group identifier for atomic transaction batches
  string outbox_uuid = 13;                  // Globally unique outbox item UUID for idempotent inbox deduplication
  string device_id = 14;                    // POS device identifier
  string batch_id = 15;                     // Correlation batch identifier (empty = legacy single-event apply)
  int32 batch_size = 16;                    // Total events in this correlation batch
  int32 seq_in_batch = 17;                  // 1-based position within the batch (1..batch_size)
}

// SyncAck acknowledges receipt and processing of a SyncEvent or atomic correlation batch
message SyncAck {
  int64 id = 1;                               // ID matching SyncEvent (last event ID for batch acks)
  string entity_type = 2;                     // Entity type acknowledged
  int64 entity_id = 3;                        // Entity primary key ID
  bool success = 4;                           // True if successfully applied
  string error_message = 5;                   // Error details if failed
  string sha256 = 6;                          // SHA-256 checksum verified by receiver
  google.protobuf.Timestamp processed_at = 7; // Processing completion timestamp
  string batch_id = 8;                        // Correlation batch ID acknowledged
  string outbox_uuid = 9;                     // Outbox UUID acknowledged (or failed item's UUID)
  int32 failed_seq = 10;                      // 1-based seq_in_batch of offending event on batch failure
  string sql_state = 11;                      // 5-char PostgreSQL SQLSTATE if failed due to DB error
}

// PullRequest initiates incremental delta-fetch from Cloud (legacy)
message PullRequest {
  string tenant_slug = 1;              // Tenant slug
  int32 store_id = 2;                  // Local store ID
  google.protobuf.Timestamp since = 3; // Sync watermark timestamp (records updated_at > since)
  repeated string entity_types = 4;    // Filter requested entities (empty = all)
  int32 limit = 5;                     // Maximum records to fetch
}

// StreamChangesRequest initiates gap-safe change_log pull from Cloud
message StreamChangesRequest {
  string tenant_slug = 1; // Tenant slug
  int32 store_id = 2;     // Local store ID
  int64 from_seq = 3;     // Exclusive lower bound change_log sequence cursor
  int32 limit = 4;        // Maximum events to stream in this page
  string device_id = 5;   // POS device identifier
}

// ChangeEvent represents a single change_log entry streamed from Cloud to POS
message ChangeEvent {
  int64 seq = 1;                             // Monotonic change_log sequence ID
  string entity_type = 2;                    // Replicated entity table name
  int64 entity_id = 3;                       // Primary key ID
  string op = 4;                             // INSERT, UPDATE, or DELETE
  bytes payload_json = 5;                    // Row JSON payload (null/optional for DELETE)
  string sha256 = 6;                         // SHA-256 hex checksum of payload_json
  google.protobuf.Timestamp changed_at = 7;  // Timestamp when the change was recorded
  bool is_snapshot_mode = 8;                 // True when catching up across compacted change_log history
  int64 snapshot_max_seq = 9;                // Target sequence cursor to advance to once snapshot catchup finishes
}

// SessionClientMsg is sent by POS over the persistent StreamSession RPC
message SessionClientMsg {
  oneof msg {
    SyncEvent push_event = 1;
    int64 pull_ack_seq = 2;
  }
}

// SessionServerMsg is sent by Cloud over the persistent StreamSession RPC
message SessionServerMsg {
  oneof msg {
    SyncAck push_ack = 1;
    ChangesAvailableNotification changes_available = 2;
  }
}

// ChangesAvailableNotification wakes connected POS terminals when new change_log rows commit
message ChangesAvailableNotification {
  int64 latest_seq = 1;
}
