name: Deploy & Migrate Multi-Tenant DBs on Junction Merge

on:
  push:
    branches:
      - junction
    paths:
      - 'packages/core/db/**'
      - 'packages/core/migrations/**'
      - 'packages/core/queries/**'
      - 'packages/core/**'
      - 'apps/cloud-server/**'
      - 'Dockerfile'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:
    inputs:
      force_migrate:
        description: 'Force run migrations even if no schema diff detected'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-migrate-deploy:
    name: Build, Backup, Multi-Tenant Migrate & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set GHCR owner lowercase
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Detect Schema / Migration Changes
        id: detect-changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "schema_changed=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Workflow dispatched manually. Migration enabled."
          else
            # Check if previous commit exists to diff
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              CHANGES=$(git diff --name-only HEAD~1 HEAD -- packages/core/db/ packages/core/migrations/ packages/core/queries/ apps/cloud-server/ || true)
            else
              CHANGES="first-commit"
            fi

            if [ -n "$CHANGES" ]; then
              echo "schema_changed=true" >> $GITHUB_OUTPUT
              echo "✅ Database schema/queries changes detected:"
              echo "$CHANGES"
            else
              echo "schema_changed=false" >> $GITHUB_OUTPUT
              echo "ℹ️ No schema or migration files modified in this commit."
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & Push POS API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/pos-api:dev
            ghcr.io/${{ env.OWNER_LC }}/pos-api:dev-${{ github.sha }}

      - name: Backup, Migrate Tenants & Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /opt/apps/pos

            # 1. Load Postgres & App Environment Variables
            if [ ! -f .env ]; then
              echo "❌ Missing required file: /opt/apps/pos/.env"
              exit 1
            fi
            
            set -a
            . ./.env
            set +a

            CONTAINER_DB="pos-postgres"
            TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
            BACKUP_DIR="/tmp/pos-backups-${TIMESTAMP}"
            TARGET_DATABASES_FILE="${BACKUP_DIR}/databases.txt"

            POSTGRES_USER="${POSTGRES_USER:-postgres}"
            POSTGRES_DB="${POSTGRES_DB:-masterDB}"
            
            echo "=================================================="
            echo "ℹ️ DB User: ${POSTGRES_USER} | Master DB: ${POSTGRES_DB}"
            echo "=================================================="

            umask 077
            mkdir -p "${BACKUP_DIR}"

            echo "🔎 1. Discovering Master DB and all active Tenant DBs..."

            # Master database is always included
            printf '%s\n' "${POSTGRES_DB}" > "${TARGET_DATABASES_FILE}"

            # Discover all active tenant databases from the tenants table
            if docker exec "${CONTAINER_DB}" psql \
              -U "${POSTGRES_USER}" \
              -d "${POSTGRES_DB}" \
              -Atc "
                SELECT DISTINCT
                  split_part(split_part(db_conn_str, '/', 4), '?', 1)
                FROM tenants
                WHERE is_active = true
                ORDER BY 1;
              " >> "${TARGET_DATABASES_FILE}" 2>/dev/null; then
                echo "✓ Discovered tenant databases from master registry."
            else
                echo "⚠️ Note: tenants table query skipped or not yet initialized. Proceeding with Master DB."
            fi

            # Deduplicate database list
            grep -v '^$' "${TARGET_DATABASES_FILE}" | sort -u > "${TARGET_DATABASES_FILE}.tmp"
            mv "${TARGET_DATABASES_FILE}.tmp" "${TARGET_DATABASES_FILE}"

            DB_COUNT=$(wc -l < "${TARGET_DATABASES_FILE}")
            echo "Target Databases Found (${DB_COUNT}):"
            sed 's/^/  - /' "${TARGET_DATABASES_FILE}"

            echo ""
            echo "📦 2. Taking pre-migration safety backups for all databases..."

            while IFS= read -r DB_NAME; do
              [ -z "${DB_NAME}" ] && continue
              
              CONTAINER_BACKUP="/tmp/${DB_NAME}_${TIMESTAMP}.dump"
              HOST_BACKUP="${BACKUP_DIR}/${DB_NAME}.dump"

              echo "  -> Backing up: ${DB_NAME}"

              if ! docker exec "${CONTAINER_DB}" pg_dump \
                -U "${POSTGRES_USER}" \
                -d "${DB_NAME}" \
                -F c \
                -f "${CONTAINER_BACKUP}"; then
                  echo "❌ pg_dump failed for database: ${DB_NAME}"
                  rm -rf "${BACKUP_DIR}"
                  exit 1
              fi

              docker cp "${CONTAINER_DB}:${CONTAINER_BACKUP}" "${HOST_BACKUP}"
              docker exec "${CONTAINER_DB}" rm -f "${CONTAINER_BACKUP}"

              if [ ! -s "${HOST_BACKUP}" ]; then
                echo "❌ Backup file empty for database: ${DB_NAME}"
                rm -rf "${BACKUP_DIR}"
                exit 1
              fi
            done < "${TARGET_DATABASES_FILE}"

            echo "✅ All pre-migration backups created in ${BACKUP_DIR}"

            echo ""
            echo "🚀 3. Pulling latest POS API container image..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            
            DEPLOY_IMAGE="ghcr.io/${{ env.OWNER_LC }}/pos-api:dev-${{ github.sha }}"
            docker pull "${DEPLOY_IMAGE}"

            # Detect Docker network
            DOCKER_NET=$(docker inspect "${CONTAINER_DB}" --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' | head -n 1)
            [ -z "${DOCKER_NET}" ] && DOCKER_NET="bridge"
            echo "ℹ️ Using Docker Network: ${DOCKER_NET}"

            echo ""
            echo "⚡ 4. Applying Atlas migrations across Master and Tenant DBs..."

            MIGRATION_FAILED=0
            FAILED_DB=""

            while IFS= read -r DB_NAME; do
              [ -z "${DB_NAME}" ] && continue
              
              echo "--------------------------------------------------"
              echo "🚀 Running Atlas migration on: ${DB_NAME}..."
              echo "--------------------------------------------------"

              # Build target database URL inside docker network
              if [ -n "${POSTGRES_PASSWORD}" ]; then
                TARGET_DB_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${CONTAINER_DB}:5432/${DB_NAME}?sslmode=disable"
              else
                TARGET_DB_URL="postgresql://${POSTGRES_USER}@${CONTAINER_DB}:5432/${DB_NAME}?sslmode=disable"
              fi

              # Execute Atlas migration with baseline protection (preserves existing data)
              if ! docker run --rm \
                --network "${DOCKER_NET}" \
                "${DEPLOY_IMAGE}" \
                /usr/local/bin/atlas migrate apply \
                  --url "${TARGET_DB_URL}" \
                  --dir "file:///app/migrations" \
                  --baseline "20260101000000"; then

                echo "❌ Atlas migration FAILED on database: ${DB_NAME}"
                echo "🔄 Automatically rolling back ${DB_NAME} from backup..."

                HOST_BACKUP="${BACKUP_DIR}/${DB_NAME}.dump"
                CONTAINER_BACKUP="/tmp/restore_${DB_NAME}_${TIMESTAMP}.dump"

                # Terminate active DB connections prior to restore
                docker exec "${CONTAINER_DB}" psql \
                  -U "${POSTGRES_USER}" \
                  -d postgres \
                  -c "
                    SELECT pg_terminate_backend(pid)
                    FROM pg_stat_activity
                    WHERE datname = '${DB_NAME}'
                      AND pid <> pg_backend_pid();
                  " || true

                docker cp "${HOST_BACKUP}" "${CONTAINER_DB}:${CONTAINER_BACKUP}"

                docker exec "${CONTAINER_DB}" pg_restore \
                  -U "${POSTGRES_USER}" \
                  -d "${DB_NAME}" \
                  --clean \
                  --if-exists \
                  --no-owner \
                  --no-privileges \
                  --exit-on-error \
                  --single-transaction \
                  -v "${CONTAINER_BACKUP}"

                docker exec "${CONTAINER_DB}" rm -f "${CONTAINER_BACKUP}"
                echo "✅ Database '${DB_NAME}' successfully restored to pre-migration state."

                MIGRATION_FAILED=1
                FAILED_DB="${DB_NAME}"
                break
              fi

              echo "✅ Migration successful for: ${DB_NAME}"
            done < "${TARGET_DATABASES_FILE}"

            if [ "${MIGRATION_FAILED}" -eq 1 ]; then
              echo "❌ Pipeline aborted due to migration failure on: ${FAILED_DB}"
              echo "Pre-migration backups preserved at: ${BACKUP_DIR}"
              exit 1
            fi

            echo ""
            echo "🎉 5. All migrations applied successfully! Restarting POS API service..."
            
            docker compose up -d --no-deps pos-api
            docker image prune -f
            rm -rf "${BACKUP_DIR}"
            
            echo "=================================================="
            echo "🚀 Deployment & Multi-Tenant Migrations Completed Successfully!"
            echo "=================================================="
