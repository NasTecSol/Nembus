name: Deploy, Backup, Migrate & Auto-Restore on Junction Merge

on:
  push:
    branches:
      - junction

permissions:
  contents: read
  packages: write

jobs:
  deploy-backup-migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & Push POS API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USER }}/pos-api:dev
            ghcr.io/${{ secrets.GHCR_USER }}/pos-api:dev-${{ github.sha }}

      - name: SSH to EC2 Server and Perform Backup, Migration & Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/apps/pos

            # 1. Load PostgreSQL credentials from the environment file.
            if [ -f .env ]; then
              set -a
              . ./.env
              set +a
            else
              echo "❌ Missing required file: /opt/apps/pos/.env"
              exit 1
            fi

            if [ -z "${POSTGRES_USER:-}" ] || [ -z "${POSTGRES_DB:-}" ]; then
              echo "❌ POSTGRES_USER and POSTGRES_DB must be defined in .env"
              exit 1
            fi

            TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
            BACKUP_FILE="/tmp/backup_pos_${TIMESTAMP}.dump"
            CONTAINER_DB="pos-postgres"
            CONTAINER_API="pos-api"

            echo "📦 1. Taking database backup from '${CONTAINER_DB}'..."
            docker exec "${CONTAINER_DB}" pg_dump \
              -U "${POSTGRES_USER}" \
              -d "${POSTGRES_DB}" \
              -F c \
              -f /tmp/backup.dump
            docker cp "${CONTAINER_DB}:/tmp/backup.dump" "${BACKUP_FILE}"
            docker exec "${CONTAINER_DB}" rm -f /tmp/backup.dump
            echo "✅ Backup stored at: ${BACKUP_FILE}"

            echo "🚀 2. Pulling latest POS API image..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USER }}" \
              --password-stdin
            docker compose pull pos-api

            echo "⚡ 3. Running migrations..."
            if ! docker compose run --rm pos-api make migrate-all; then
              echo "❌ Migration failed. Restoring database from: ${BACKUP_FILE}"

              # Stop the API to avoid active application connections during restore.
              docker compose stop pos-api || true

              docker cp "${BACKUP_FILE}" "${CONTAINER_DB}:/tmp/backup.dump"
              docker exec "${CONTAINER_DB}" pg_restore \
                -U "${POSTGRES_USER}" \
                -d "${POSTGRES_DB}" \
                --clean \
                --if-exists \
                --no-owner \
                --no-privileges \
                -v \
                /tmp/backup.dump
              docker exec "${CONTAINER_DB}" rm -f /tmp/backup.dump

              echo "✅ Database restored to its pre-migration state."
              rm -f "${BACKUP_FILE}"
              exit 1
            fi

            echo "🎉 4. Migration successful. Restarting POS API service..."
            docker compose up -d --no-deps pos-api
            docker image prune -f
            rm -f "${BACKUP_FILE}"
            echo "🚀 Deployment and migrations completed successfully!"
