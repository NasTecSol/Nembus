name: Deploy, Backup, Migrate & Auto-Restore on Junction Merge

on:
  push:
    branches:
      - junction

permissions:
  contents: read
  packages: write

jobs:
  deploy-backup-migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & Push POS API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USER }}/pos-api:dev
            ghcr.io/${{ secrets.GHCR_USER }}/pos-api:dev-${{ github.sha }}

      - name: Backup, Migrate and Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /opt/apps/pos

            if [ ! -f .env ]; then
              echo "❌ Missing required file: /opt/apps/pos/.env"
              exit 1
            fi

            set -a
            . ./.env
            set +a

            if [ -z "${POSTGRES_USER:-}" ] ||
               [ -z "${POSTGRES_DB:-}" ] ||
               [ -z "${MASTER_DB_URL:-}" ]; then
              echo "❌ POSTGRES_USER, POSTGRES_DB and MASTER_DB_URL are required"
              exit 1
            fi

            CONTAINER_DB="pos-postgres"
            TIMESTAMP="$(date +'%Y%m%d_%H%M%S')"
            BACKUP_DIR="/tmp/pos-backups-${TIMESTAMP}"
            TARGET_DATABASES_FILE="${BACKUP_DIR}/databases.txt"

            umask 077
            mkdir -p "${BACKUP_DIR}"

            echo "🔎 1. Discovering databases targeted by migrations..."

            UNSUPPORTED_TENANTS="$(
              docker exec "${CONTAINER_DB}" psql \
                -U "${POSTGRES_USER}" \
                -d "${POSTGRES_DB}" \
                -Atc "
                  SELECT count(*)
                  FROM tenants
                  WHERE is_active = true
                    AND split_part(
                      split_part(db_conn_str, '@', 2),
                      '/',
                      1
                    ) <> 'postgres:5432';
                "
            )"

            if [ "${UNSUPPORTED_TENANTS}" != "0" ]; then
              echo "❌ One or more active tenant databases are outside pos-postgres."
              echo "   Automatic backup and restore cannot safely continue."
              exit 1
            fi

            printf '%s\n' "${POSTGRES_DB}" > "${TARGET_DATABASES_FILE}"

            docker exec "${CONTAINER_DB}" psql \
              -U "${POSTGRES_USER}" \
              -d "${POSTGRES_DB}" \
              -Atc "
                SELECT DISTINCT
                  split_part(
                    split_part(db_conn_str, '/', 4),
                    '?',
                    1
                  )
                FROM tenants
                WHERE is_active = true
                ORDER BY 1;
              " >> "${TARGET_DATABASES_FILE}"

            sort -u "${TARGET_DATABASES_FILE}" \
              > "${TARGET_DATABASES_FILE}.sorted"
            mv "${TARGET_DATABASES_FILE}.sorted" \
              "${TARGET_DATABASES_FILE}"

            echo "Databases selected:"
            sed 's/^/  - /' "${TARGET_DATABASES_FILE}"

            while IFS= read -r DB_NAME; do
              case "${DB_NAME}" in
                ""|*[!A-Za-z0-9_-]*)
                  echo "❌ Unsafe database name: ${DB_NAME}"
                  exit 1
                  ;;
              esac

              docker exec "${CONTAINER_DB}" psql \
                -U "${POSTGRES_USER}" \
                -d "${DB_NAME}" \
                -Atc "SELECT 1;" > /dev/null
            done < "${TARGET_DATABASES_FILE}"

            echo "📦 2. Backing up all targeted databases..."

            while IFS= read -r DB_NAME; do
              CONTAINER_BACKUP="/tmp/${DB_NAME}_${TIMESTAMP}.dump"
              HOST_BACKUP="${BACKUP_DIR}/${DB_NAME}.dump"

              echo "Backing up: ${DB_NAME}"

              docker exec "${CONTAINER_DB}" pg_dump \
                -U "${POSTGRES_USER}" \
                -d "${DB_NAME}" \
                -F c \
                -f "${CONTAINER_BACKUP}"

              docker cp \
                "${CONTAINER_DB}:${CONTAINER_BACKUP}" \
                "${HOST_BACKUP}"

              docker exec "${CONTAINER_DB}" \
                rm -f "${CONTAINER_BACKUP}"

              if [ ! -s "${HOST_BACKUP}" ]; then
                echo "❌ Backup is empty or missing: ${HOST_BACKUP}"
                exit 1
              fi
            done < "${TARGET_DATABASES_FILE}"

            echo "✅ All database backups completed."

            echo "🚀 3. Pulling the latest POS API image..."

            echo "${{ secrets.GHCR_PAT }}" |
              docker login ghcr.io \
                -u "${{ secrets.GHCR_USER }}" \
                --password-stdin

            docker compose pull pos-api

            echo "⚡ 4. Running master and tenant migrations..."

            if ! docker compose run --rm --no-deps pos-api sh -ec '
              echo "Running master database migrations..."
              goose \
                -dir /app/migrations \
                postgres \
                "$MASTER_DB_URL" \
                up

              echo "Running active tenant database migrations..."
              /app/migrate-tenants -dir /app/migrations
            '; then
              echo "❌ Migration failed. Restoring all databases..."

              docker compose stop pos-api || true

              while IFS= read -r DB_NAME; do
                HOST_BACKUP="${BACKUP_DIR}/${DB_NAME}.dump"
                CONTAINER_BACKUP="/tmp/restore_${DB_NAME}_${TIMESTAMP}.dump"

                echo "Restoring: ${DB_NAME}"

                docker exec "${CONTAINER_DB}" psql \
                  -U "${POSTGRES_USER}" \
                  -d postgres \
                  -v ON_ERROR_STOP=1 \
                  -c "
                    SELECT pg_terminate_backend(pid)
                    FROM pg_stat_activity
                    WHERE datname = '${DB_NAME}'
                      AND pid <> pg_backend_pid();
                  "

                docker cp \
                  "${HOST_BACKUP}" \
                  "${CONTAINER_DB}:${CONTAINER_BACKUP}"

                docker exec "${CONTAINER_DB}" pg_restore \
                  -U "${POSTGRES_USER}" \
                  -d "${DB_NAME}" \
                  --clean \
                  --if-exists \
                  --no-owner \
                  --no-privileges \
                  --exit-on-error \
                  --single-transaction \
                  -v \
                  "${CONTAINER_BACKUP}"

                docker exec "${CONTAINER_DB}" \
                  rm -f "${CONTAINER_BACKUP}"

                echo "✅ Restored: ${DB_NAME}"
              done < "${TARGET_DATABASES_FILE}"

              rm -rf "${BACKUP_DIR}"

              echo "✅ All databases restored to their pre-migration state."
              exit 1
            fi

            echo "🎉 5. Migrations successful. Deploying POS API..."

            docker compose up -d --no-deps pos-api

            docker image prune -f
            rm -rf "${BACKUP_DIR}"

            echo "🚀 Deployment and migrations completed successfully!"